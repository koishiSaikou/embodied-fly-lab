<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>实验记录 · 果蝇实验场</title>
  <link rel="stylesheet" href="/assets/records.css">
  <link rel="stylesheet" href="/assets/experiment_io.css?v=20261017">
  <script src="/assets/experiment_io.js?v=20261017" defer></script>
  <script src="/assets/records.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div><h1>实验记录</h1><p>保存数据与配置 · 本地查看 · 导入分享</p></div>
    <nav aria-label="项目页面"><a href="/">返回实验场</a><a href="/licenses" target="_blank" rel="noopener">许可与来源</a></nav>
  </header>
  <main class="library">
    <aside class="sidebar" aria-label="本地实验列表">
      <div class="sidebar-head"><h2>本地实验 <span id="runCount" class="muted"></span></h2><button id="refresh">刷新</button></div>
      <label class="search-label" for="search">筛选记录</label><input id="search" type="search" placeholder="输入实验名称或编号" autocomplete="off">
      <div id="runList" class="run-list" role="list" aria-label="实验记录"></div>
      <section class="import-box"><h2>导入朋友的实验</h2><p class="muted">选择由本项目导出的 ZIP。“导入后运行…”会先导入并打开配置，再由你选择重放；不会停止当前实验。</p><label class="file-label" for="importFile">选择实验 ZIP</label><input id="importFile" type="file" accept=".zip,application/zip"><div class="eio-import-actions"><button id="importButton" disabled>仅导入查看</button><button id="importRunButton" disabled>导入后运行…</button></div></section>
    </aside>
    <section class="detail" aria-label="实验详情">
      <div id="message" class="message" role="status" aria-live="polite">正在读取本地记录…</div>
      <div id="empty" class="empty"><h2>选择一份实验记录</h2><p>可以查看配置、轨迹和感觉行为数据，也可以导出后交给朋友导入。</p><p>记录是实验数据与复现起点，不是完整脑和身体状态的即时存档。</p></div>
      <article id="record" hidden>
        <div class="record-head"><div><h2 id="recordTitle"></h2><p id="recordIdentity" class="muted"></p></div><div class="eio-record-actions"><button id="recordSaveAs" disabled>另存到…</button><a id="exportLink" class="button" download>导出分享 ZIP</a></div></div>
        <div id="metrics" class="metrics"></div>
        <section class="reproduce-box" aria-labelledby="reproduceTitle">
          <div><h3 id="reproduceTitle">用这份记录新开实验</h3><p class="muted">从初始姿态重新运行；不恢复已运行到一半的膜电位、随机数状态或身体速度，也不承诺逐帧一致。</p></div>
          <div class="reproduce-actions"><label><input id="replayEvents" type="checkbox" checked>按模型时间重放已记录的调整事件（仅初始模式）</label><div class="button-row"><button id="reproduceInitial" disabled>初始条件重放</button><button id="reproduceFinal" disabled>最终配置与学习记忆新实验</button></div></div>
          <p id="reproduceReason" class="muted"></p><div id="cliBox" class="cli-box" hidden><label for="cliCommand">独立查看器可关闭后，在项目目录终端运行</label><div><input id="cliCommand" readonly><button id="copyCommand">复制命令</button></div><p class="muted">命令会从初始条件新开实验；请先结束占用同一端口的服务。</p></div>
        </section>
        <div id="tabs" class="tabs" role="tablist" aria-label="记录内容"></div>
        <section id="content" class="content" role="tabpanel" tabindex="0"></section>
      </article>
    </section>
  </main>
</body>
</html>
